[package]
name = "effectcraft-aex-probe"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Isolated experimental Windows Adobe effect plugin initialization probe"

[dependencies]
after-effects-sys = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }

[workspace]
members = ["fixtures/gain"]

[profile.dev]
opt-level = 1
debug = 0

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

